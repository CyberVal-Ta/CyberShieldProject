name: Collaborative Workflow

on:
  push:
    branches: 
      - main

jobs:
  update_html_and_readme:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Update index.html based on who pushed
      - name: Update index.html
        run: |
          if [ "${{ github.actor }}" == "CyberVal-Ta" ]; then
            sed -i '/<\/body>/i <p>Updated by Team Leader on '"$(date)"'</p>' index.html
          else
            sed -i '/<\/body>/i <p>Updated by '"${{ github.actor }}"' on '"$(date)"'</p>' index.html
          fi

      # Step 3: Update README.md
      - name: Update README
        run: |
          echo -e "\n## Updated by ${{ github.actor }} on $(date) [Commit: ${{ github.sha }}]" >> README.md
